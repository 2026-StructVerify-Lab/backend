name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            if [ ! -d ~/backend ]; then
              git clone https://${{ secrets.GH_TOKEN }}@github.com/2026-StructVerify-Lab/backend.git ~/backend
              cd ~/backend
              python3 -m venv .venv
            else
              cd ~/backend
            fi
            git pull origin main
            source .venv/bin/activate
            pip install -r requirements.txt
            pip install argon2-cffi psycopg2-binary passlib python-jose pydantic-settings
            export $(cat .env | xargs)
            alembic -c sv_platform/alembic.ini upgrade head
            pm2 restart backend || pm2 start "uvicorn main:app --host 0.0.0.0 --port 8000" --name backend