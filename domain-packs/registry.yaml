advertising_industry: 광고 산업 (매출, 온라인 광고 대행업, 성장 추세)
agriculture: 농림수산식품 (농가, 경작면적, 수확량, 축산, 어업)
automotive_technology: 자동차 기술 및 혁신 (전기차, 자율주행, 커넥티드카, AI 기술)
construction_statistics: 건설공사 계약 실적 및 관련 통계
economy: 경제/경기 (GDP, 성장률, 소비, 수출입, 물가, 산업생산)
education: 교육 (학생, 학교, 교육비, 진학률, 입시)
employment: 고용/노동/임금 (취업률, 실업률, 임금, 근로시간)
environment: 환경/에너지 (기후, 탄소, 재생에너지, 환경오염)
finance: 금융/증권 (금리, 환율, 주가, 대출, 가계부채, 보험)
food_industry: 식품 산업 (제조업, 가공식품, 인증, 품질 관리)
general: 분류 불가 또는 복합 도메인
healthcare: 보건/의료 (질병, 의료기관, 사망률, 건강보험)
insurance: 보험 (생명보험, 손해보험, 보험료, 보험사)
it_industry: 정보기술 산업 (IT 기술, 소프트웨어, 하드웨어, 인공지능, 빅데이터)
policy: 정책/행정 (예산, 법률, 복지, 지원금, 정부)
population: 인구/가구 (출생, 사망, 혼인, 고령화, 인구구조)
real_estate: 부동산 (아파트, 매매가, 전세, 분양)
transportation_industry: 운수업 (운송업, 물류, 교통, 수상운송업)
weather: 날씨 및 기후 변화 (기상청, 날씨 예보, 기후 변화)
