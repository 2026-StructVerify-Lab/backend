# Outcome eval dataset builder — KOSIS-first, no synthetic articles
dataset_id: structverify_outcome_v1
datasets_root: eval/datasets

registry_path: domain-packs/registry.yaml
exclude_domains:
  - general

target_cases: 50
seed: 42

# Method A + C
match_ratio: 0.55
mismatch_ratio: 0.45

value_tolerance_relative: 0.005
value_tolerance_absolute: 0.1

max_domain_retries: 8
catalog_top_k: 10

# Skip KOSIS rows whose UNIT_NM is ambiguous for templated claims (probe tries next stat)
probe_unit_skip_substrings:
  - "명 %"
  - "명 % 점"
  - "개%"

# Domain → catalog search keyword hints
domain_keywords:
  healthcare: ["의료", "건강", "병원"]
  employment: ["고용", "취업", "실업"]
  economy: ["경제", "GDP", "성장"]
  population: ["인구", "출생", "사망"]
  finance: ["금융", "금리", "대출"]
  education: ["교육", "학생", "학교"]
  environment: ["환경", "에너지", "탄소"]
  agriculture: ["농업", "농가", "수확"]
  real_estate: ["부동산", "주택", "아파트"]
  weather: ["기온", "강수", "기상"]

emit_component_fixtures: true
component_dataset_id: structverify_components_v1

# kosis/llm: loaded from config/default.yaml + .env (KOSIS_API_KEY, NCP_API_KEY)
