# Alembic 설정 — sv_platform DB migration
#
# 사용:
#   cd backend
#   alembic -c sv_platform/alembic.ini upgrade head
#   alembic -c sv_platform/alembic.ini revision --autogenerate -m "new change"
#
# sqlalchemy.url은 환경변수 POSTGRES_DSN으로 override 됨 (alembic/env.py 참조).
# 동기 드라이버 사용 (alembic 자체는 sync — asyncpg 대신 psycopg2 추천).

[alembic]
script_location = sv_platform/alembic
sqlalchemy.url = postgresql://structverify:structverify@localhost:5432/structverify

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
